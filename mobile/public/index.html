<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover lets the app paint under the notch and the home indicator once
         it is launched from the home screen; safe-area-context reads the insets back. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover"
    />
    <title>Invest Platform</title>

    <!-- Static crawl/share metadata. React Navigation rewrites the <title> per route at
         runtime (see linking.ts documentTitle), but a link unfurled in a chat or a search
         crawler reads the markup as served, before any script runs — so the description and
         the Open Graph pair are declared here rather than in JS. -->
    <meta
      name="description"
      content="Инвестиционная платформа: проекты, доли, вторичный рынок тикетов и выплаты."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Invest Platform" />
    <meta
      property="og:description"
      content="Инвестиционная платформа: проекты, доли, вторичный рынок тикетов и выплаты."
    />
    <meta property="og:image" content="/icon.png" />
    <meta name="twitter:card" content="summary" />

    <!-- iOS has no installable-PWA prompt: Safari only honours these tags, and only from
         "Add to Home Screen". They are what buys an app icon and a chromeless window on
         iPhone, which is the whole reason the web build exists. -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#2E6F45" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Invest" />
    <link rel="apple-touch-icon" href="/icon.png" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>Для работы приложения нужно включить JavaScript.</noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
