services:
  # The web build, mainly so iPhone users have something to open at all: Apple allows no
  # sideloading, and TestFlight needs a paid account we do not have yet.
  - type: web
    name: invest-platform-web
    runtime: static
    rootDir: mobile
    buildCommand: npm ci && npx expo export --platform web
    staticPublishPath: ./dist
    # The app routes on the client, so every path has to be handed the same document —
    # without this a refresh anywhere but "/" is a 404 from the CDN.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: EXPO_PUBLIC_API_URL
        value: https://invest-platform-api-7msz.onrender.com/api

  - type: web
    name: invest-platform-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: node dist/main
    healthCheckPath: /api
    envVars:
      # NODE_ENV stays off "production" on purpose while we are still a test
      # stand: it keeps TypeORM's synchronize on, so entity changes reach the
      # database without migrations. Flip it before a real release.
      - key: NODE_ENV
        value: staging
      # Set these in the Render dashboard, not here.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
